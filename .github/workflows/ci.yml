name: CI

# develop is the integration branch under Gitflow, so it is tested alongside
# main; a workflow triggering only on main would never see the work.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Lint
        run: ruff check .

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # TensorFlow 2.15 publishes wheels for cp39, cp310 and cp311 only.
        python-version: ["3.10", "3.11"]
        include:
          # One Windows job, since the project is documented as cross-platform.
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7

      # opencv-python links against libGL, which the Linux runners do not
      # carry by default; importing cv2 fails without it.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Check that the imports work
        run: python -c "import cv2, tensorflow, facemask; print(facemask.__version__)"

      - name: Check that the entry points are installed
        run: |
          facemask-train --version
          facemask-detect --help

      - name: Run tests
        run: pytest -q
